<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebAR - Debugging Kamera</title>
    <!-- Kita gunakan versi CDN AR.js yang lebih stabil (3.3.2) -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar.js"></script>
    
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #000000; /* Jika kamera gagal, layar akan jadi hitam, bukan putih */
      }
      .header-ui {
        position: absolute;
        top: 0; left: 0; width: 100%;
        background-color: rgba(30, 30, 30, 0.9);
        color: white;
        text-align: center;
        padding: 15px 0;
        font-family: Arial, sans-serif;
        font-weight: bold;
        z-index: 9999;
      }
    </style>
  </head>
  
  <body>
    <div class="header-ui">Status: Cek Kamera AR...</div>

    <!-- Scene AR -->
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro">
        <!-- Kita kembalikan ke kubus merah untuk memastikan kamera dan tracking jalan -->
        <a-box position="0 0.5 0" material="color: red;"></a-box>
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
