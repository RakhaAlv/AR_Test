<!DOCTYPE html>
<html>
  <head>
    <title>Simulasi Nanem Padi Glawan</title>
    <!-- Load Library Utama A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <!-- Load Ekstensi untuk Animasi 3D -->
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <a-scene embedded arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Preload Aset 3D dari folder lokal -->
      <a-assets>
        <a-asset-item id="model-padi" src="assets/Padi.glb"></a-asset-item>
      </a-assets>

      <!-- Menggunakan Marker 'Hiro' untuk mendeteksi posisi -->
      <a-marker preset="hiro">
        
        <!-- Menampilkan Model 3D Padi -->
        <!-- Atribut 'animation-mixer' akan menjalankan animasi jika ada di dalam file .glb -->
        <a-entity 
            gltf-model="#model-padi" 
            scale="0.5 0.5 0.5" 
            position="0 0 0" 
            animation-mixer>
        </a-entity>
        
      </a-marker>
      
      <a-entity camera></a-entity>
    </a-scene>
    
  </body>
</html>
